name: Sentinel AI CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Frontend Test & Build Verification
  # ===========================================================================
  frontend-check:
    name: Frontend (Lint, Typecheck, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check & Vite Production Build
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm test

  # ===========================================================================
  # 2. Backend Test & Migration Verification
  # ===========================================================================
  backend-check:
    name: Backend (Migrations & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinelai
          POSTGRES_USER: sentinelai_user
          POSTGRES_PASSWORD: sentinelai_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic database migrations
        env:
          DATABASE_URL: postgresql+psycopg://sentinelai_user:sentinelai_dev_password@localhost:5432/sentinelai
          JWT_SECRET: test_ci_jwt_secret_key_1234567890
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://sentinelai_user:sentinelai_dev_password@localhost:5432/sentinelai
          JWT_SECRET: test_ci_jwt_secret_key_1234567890
          ENVIRONMENT: test
          DEBUG: "false"
        run: pytest -q tests/unit/

  # ===========================================================================
  # 3. Docker Container Build Verification
  # ===========================================================================
  docker-build-smoke:
    name: Docker Container Build Smoke Check
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: sentinelai-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: sentinelai-frontend:ci-check
