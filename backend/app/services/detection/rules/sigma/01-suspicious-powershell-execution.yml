title: Suspicious PowerShell Execution
id: 11111111-1111-4111-8111-111111111111
status: stable
description: Detects PowerShell launched with common obfuscation or script-downloading
  flags targeting the SentinelAI process event category.
author: SentinelAI Detection Team
date: 2024-06-15
level: high
logsource:
  category: process
  product: windows
detection:
  selection_powershell:
    event_category: process
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - '-enc'
      - '-nop'
      - '-noprofile'
      - 'DownloadString'
  condition: selection_powershell and selection_flags
fields:
  - event_category
  - Image
  - CommandLine
falsepositives:
  - Administrative remoting shells that legitimately use the same flags