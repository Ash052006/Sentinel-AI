title: Remote Interactive Administrative Logon
id: 99999999-9999-4999-8999-999999999999
status: stable
description: Detects successful remote interactive (RDP-style) logon events attributed to administrative accounts, a common vector for remote access and lateral movement.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: high
logsource:
  category: authentication
  product: windows
detection:
  selection_category:
    event_category: authentication
  selection_logon:
    action|contains: logon
  selection_admin:
    User|contains:
      - admin
      - administrator
      - root
  selection_remote:
    logon_type: '10'
  condition: selection_category and selection_logon and selection_admin and selection_remote
fields:
  - event_category
  - action
  - User
  - logon_type
falsepositives:
  - Legitimate tiered remote administration from approved jump hosts or privileged access management platforms