title: Service Account Logon
id: 11000000-0000-4000-8000-000000000000
status: stable
description: Detects successful interactive logon events using service-style accounts (trailing dollar sign), which should normally never authenticate interactively.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: medium
logsource:
  category: authentication
  product: windows
detection:
  selection_category:
    event_category: authentication
  selection_logon:
    action|contains: logon
  selection_service_account:
    User|endswith: $
  selection_success:
    outcome: success
  condition: selection_category and selection_logon and selection_service_account and selection_success
fields:
  - event_category
  - action
  - User
  - outcome
falsepositives:
  - Machine-account logons from monitoring or scheduled-task services that legitimately use service accounts