title: Anonymous or Guest Logon Attempt
id: 12000000-0000-4000-8000-000000000000
status: experimental
description: Detects authentication events that resolve to anonymous, guest, or NULL identities, which are frequently abused for unauthenticated resource access.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: medium
logsource:
  category: authentication
  product: windows
detection:
  selection_category:
    event_category: authentication
  selection_logon:
    action|contains: logon
  selection_identity:
    User|contains:
      - anonymous
      - guest
  condition: selection_category and selection_logon and selection_identity
fields:
  - event_category
  - action
  - User
falsepositives:
  - Guest/anonymous access to intentionally open file shares and network-adjacent devices