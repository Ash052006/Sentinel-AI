title: Remote Desktop Authentication Event
id: 13000000-0000-4000-8000-000000000000
status: stable
description: Detects successful authentication events destined to the Remote Desktop (RDP) service port with a remote interactive logon type, a common target for external RDP brute force and hijacking.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: high
logsource:
  category: authentication
  product: windows
detection:
  selection_category:
    event_category: authentication
  selection_remote_interactive:
    logon_type: '10'
  selection_rdp_port:
    DestinationPort: '3389'
  selection_success:
    outcome: success
  condition: selection_category and selection_remote_interactive and selection_rdp_port and selection_success
fields:
  - event_category
  - logon_type
  - DestinationPort
  - outcome
falsepositives:
  - Approved remote administration sessions over RDP from sanctioned gateways or jump hosts