title: Scripting Host Spawns PowerShell
id: 14000000-0000-4000-8000-000000000000
status: stable
description: Detects a Windows scripting host (wscript, cscript, mshta) spawning a PowerShell process, a classic pattern for download-and-execute delivery and in-memory droppers.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: high
logsource:
  category: process
  product: windows
detection:
  selection_category:
    event_category: process
  selection_parent:
    ParentImage|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection_category and selection_parent and selection_child
fields:
  - event_category
  - ParentImage
  - Image
falsepositives:
  - Packaging, cleanup, and admin scripts that legitimately launch PowerShell from wscript/cscript