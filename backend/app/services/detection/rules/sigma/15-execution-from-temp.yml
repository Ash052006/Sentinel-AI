title: Program Execution From Temporary Directory
id: 15000000-0000-4000-8000-000000000000
status: experimental
description: Detects process creation from commonly writable temporary directories, an unreliable-but-repeated pattern used to stage payloads outside protected paths.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: medium
logsource:
  category: process
  product: windows
detection:
  selection_category:
    event_category: process
  selection_temp_path:
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'
      - '\Temp\'
  condition: selection_category and selection_temp_path
fields:
  - event_category
  - Image
falsepositives:
  - Installers and updaters that legitimately execute bootstrap binaries staged under temporary directories