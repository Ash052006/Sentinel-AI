title: Local Credential Dump Attempt
id: 19000000-0000-4000-8000-000000000000
status: stable
description: Detects command-line patterns used to extract local credential material via registry SAM/SYSTEM save, Volume Shadow Copy, NTDS extraction, or ESE dump utilities.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: critical
logsource:
  category: process
  product: windows
detection:
  selection_category:
    event_category: process
  selection_dump:
    CommandLine|contains:
      - reg.exe save
      - vssadmin
      - ntds.dit
      - esentutl /y
      - wmic shadowcopy
  condition: selection_category and selection_dump
fields:
  - event_category
  - CommandLine
falsepositives:
  - Backup agents that legitimately shadow-copy volumes for recovery purposes