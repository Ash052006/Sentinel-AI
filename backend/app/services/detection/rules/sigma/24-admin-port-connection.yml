title: Network Connection To Administrative Service Port
id: 24000000-0000-4000-8000-000000000000
status: experimental
description: Detects network connections destined to administrative remote-management service ports (SSH, Telnet, RDP, VNC, WinRM), which are frequently targeted for brute force and remote control.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: high
logsource:
  category: network
  product: windows
detection:
  selection_category:
    event_category: network
  selection_admin_port:
    DestinationPort:
      - '22'
      - '23'
      - '3389'
      - '5900'
      - '5985'
      - '5986'
  condition: selection_category and selection_admin_port
fields:
  - event_category
  - DestinationPort
falsepositives:
  - Approved remote-management traffic from enterprise administration networks and agent management platforms