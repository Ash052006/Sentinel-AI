title: Network Connection To IRC Command-and-Control Port
id: 25000000-0000-4000-8000-000000000000
status: experimental
description: Detects connection activity to the classic IRC listener port, historically used by botnets as a command-and-control channel.
author: SentinelAI Detection Team
date: 2026-09-23
version: 1
level: high
logsource:
  category: network
  product: firewall
detection:
  selection_category:
    event_category: network
  selection_connect:
    action|contains: connect
  selection_irc_port:
    DestinationPort: '6667'
  condition: selection_category and selection_connect and selection_irc_port
fields:
  - event_category
  - action
  - DestinationPort
falsepositives:
  - Legitimate support IRC channels used by operations teams on sanctioned hosts