[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    gemini_integration: live Gemini API test, runs only when GEMINI_API_KEY is set (<pytest -m gemini_integration>)
    rag_integration: live Qdrant integration test for the Knowledge & RAG layer, runs only when an explicit marker is requested (<pytest -m rag_integration>)
